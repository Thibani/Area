services:
  mongo:
    image: mongo:8
    # Single-node replica set: needed for transactions (ENG-RETRY, AI-REVIEW)
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  server:
    build: ./server
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/area?replicaSet=rs0
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy

  client_mobile:
    build: ./mobile
    volumes:
      - apk:/apk

  client_web:
    build: ./web
    ports:
      - "8081:8081"
    volumes:
      - apk:/apk:ro
    depends_on:
      server:
        condition: service_started
      client_mobile:
        condition: service_completed_successfully

volumes:
  mongo-data:
  apk:
