name: Mirror to Epitech

on:
  push:
    branches: [main]

jobs:
  mirror:
    # Mirror only from the GitHub repo, never from the Epitech copy itself
    if: github.repository == 'Thibani/Area'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
