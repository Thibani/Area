server {
    listen 8081;
    root /usr/share/nginx/html;

    # APK produced by the mobile builder, shared through the "apk" volume
    location = /client.apk {
        alias /apk/client.apk;
        default_type application/vnd.android.package-archive;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
